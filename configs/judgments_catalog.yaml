# Nyaya-RAG landmark Supreme Court judgments catalog (v0.2, per ADR-002).
#
# HOW TO FILL: for each entry, open the judgment on e-SCR
# (https://digiscr.sci.gov.in or https://judgments.ecourts.gov.in), find the
# official PDF, and paste its direct https URL into `url`. Copy the reporter
# citation as printed into `citation`. Do NOT guess URLs or citations — the
# downloader validates content-type + PDF magic bytes and refuses entries
# without a verified https url (same discipline as the acts catalog).
#
# The case titles below are real, well-known landmark cases used ONLY as a
# starting checklist; verify each title against the official document you
# download. Trim or extend the list as you like — ~30 is the ADR-002 target.
#
# subject: one of the Subject enum values (constitutional, criminal, ...).

