# Nyaya-RAG v1 corpus catalog.
#
# url: fill each one MANUALLY from indiacode.nic.in (Browse -> Central Acts ->
# act page -> the PDF link under "Act Detail"), or legislative.gov.in for the
# Constitution. Do NOT guess URLs — the downloader validates content-type and
# PDF magic bytes, and refuses entries without a verified https URL.
# This manual step is deliberate: it doubles as a licensing + provenance audit.
#
# era: old_code (pre-1 July 2024 criminal regime) | new_code | neutral
# priority: 1 = required for v1 gold-set coverage, 2 = stretch

acts:
