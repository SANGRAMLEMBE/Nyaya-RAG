[project]
name = "nyaya-rag"
version = "0.1.0"
description = "Era-aware, citation-verified RAG over Indian statutes — fully local, zero external APIs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "httpx>=0.27",
    "tenacity>=8.2",
    "rich>=13.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
    "types-PyYAML",
]
# install torch FIRST with the CUDA index (see docs/SETUP_A100.md), then this group
rag = [
    "sentence-transformers==3.0.1",   # 5.x crashes on Windows Python 3.12 + CUDA
    "qdrant-client>=1.9",
    "rank-bm25>=0.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",         # talks to the LOCAL vLLM server; no outbound calls
    "streamlit>=1.35",
]
train = [
    "datasets>=2.19",
    "peft>=0.11",
    "trl>=0.9",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nyaya*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]  # asserts are fine in this codebase

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
